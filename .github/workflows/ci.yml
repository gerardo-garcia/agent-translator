name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --all-extras installs the optional validators (botocore, azure-ai-projects, pyagentspec,
      # agent-framework-declarative) so the tests that check output against the platforms' own
      # schemas run instead of being skipped.
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  # google-adk needs openai<3 while the Azure SDK extras resolve to openai 3.x, so the two cannot
  # share one lock file: the real-ADK loader test runs in its own overlay environment.
  adk-loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: >
          uv run --locked --all-extras --with "google-adk[extensions]" --with mcp
          pytest -q tests/test_adk_real_loader.py

  crewai-loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: >
          uv run --locked --all-extras --with crewai --with crewai-tools
          pytest -q tests/test_crewai_real_loader.py

  langgraph-loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: >
          uv run --locked --all-extras --with langgraph --with langchain
          --with langchain-mcp-adapters pytest -q tests/test_langgraph_real_loader.py
