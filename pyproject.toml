[project]
name = "agent-translator"
version = "0.1.0"
description = "Translate AI agent definitions between platforms (Bedrock, ADK, Azure Foundry, Kagent) via a common IR"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "jsonschema>=4.20"]
# optional: validate Azure output with Microsoft's own models (tests skip without them)
validate-azure = ["azure-ai-projects>=2", "agent-framework-declarative>=1.5"]
validate-agentspec = ["pyagentspec>=26.3"]
validate-bedrock = ["botocore>=1.40"]
fetch-aws = ["boto3>=1.40"]
fetch-azure = ["azure-ai-projects>=2", "azure-identity>=1.19"]
fetch-gcp = ["google-auth>=2.30", "requests>=2.31"]

[project.entry-points."agent_translator.fetchers"]
bedrock = "agent_translator.fetch.bedrock:fetch"
kagent = "agent_translator.fetch.kagent:fetch"
azure = "agent_translator.fetch.azure:fetch"
adk = "agent_translator.fetch.adk:fetch"

[project.entry-points."agent_translator.deployers"]
bedrock = "agent_translator.deploy.bedrock"
kagent = "agent_translator.deploy.kagent"
azure = "agent_translator.deploy.azure"
adk = "agent_translator.deploy.adk"

[project.scripts]
agent-translator = "agent_translator.cli:app"

[project.entry-points."agent_translator.adapters"]
kagent = "agent_translator.adapters.kagent:KagentAdapter"
bedrock = "agent_translator.adapters.bedrock:BedrockAdapter"
adk = "agent_translator.adapters.adk:AdkAdapter"
azure = "agent_translator.adapters.azure:AzureAdapter"
agentspec = "agent_translator.adapters.agentspec:AgentSpecAdapter"
agentcore = "agent_translator.adapters.agentcore:AgentCoreAdapter"
langgraph = "agent_translator.adapters.langgraph:LangGraphAdapter"
crewai = "agent_translator.adapters.crewai:CrewAIAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]  # typer defaults; detect() must never raise
